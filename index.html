<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ようこそ！</title>

  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      padding: 80px 20px;
      background: #f5f5f5;
    }

    input, button {
      padding: 12px;
      margin: 6px;
      font-size: 16px;
    }

    #message {
      display: none;
      margin-top: 25px;
    }
  </style>
</head>

<body>
  <h1>ようこそ！</h1>
  <p>パスワードを入力してください。</p>

  <input id="password" type="password"
         placeholder="パスワード">

  <button onclick="checkPassword()">開く</button>

  <p id="error"></p>

  <div id="message">
    <h2>全部嘘でしたｗｗｗｗｗ</h2>
    <p>ｍ９(^Д^)騙されてて草ｗｗｗ</p>
  </div>

  <script>
    function checkPassword() {
      const password =
        document.getElementById("password").value;

      if (password === "といぢなえらうおｙ") {
        document.getElementById("message").style.display = "block";
        document.getElementById("error").textContent = "";
      } else {
        document.getElementById("error").textContent =
          "パスワードが違います(>_<)";
        document.getElementById("message").style.display = "none";
      }
    }
  </script>
</body>
</html>
